[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ridepool-sim"
version = "0.1.0"
description = "A multi-agent ride-pooling & dispatching simulation environment for transportation gig-market research."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
data = ["pandas>=1.3"]
dev = ["pytest>=7.0"]
osmnx = ["osmnx>=1.3"]

[tool.setuptools.packages.find]
include = ["ridepool_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]