name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tools and the core package
        run: python -m pip install --upgrade build twine .
      - name: Check release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from ride_gym import __version__

          expected = f"v{__version__}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Release tag must match package version: {expected}")
          PY
      - name: Run core regressions
        run: python -m unittest discover -s tests -q
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check package boundaries and metadata
        run: |
          python .github/scripts/verify_distribution.py dist/*.whl dist/*.tar.gz
          python -m twine check --strict dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/ride-gym
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
