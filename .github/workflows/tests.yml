name: Tests

on:
  push:
  pull_request:

jobs:
  core:
    # Python 3.9 has prebuilt binaries for this runner image.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m examples.optional_features
      - name: Check standalone distributions
        if: matrix.python == '3.12'
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python .github/scripts/verify_distribution.py dist/*.whl dist/*.tar.gz
          python -m twine check --strict dist/*.whl dist/*.tar.gz
